<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Login - Sistema Lanchonete</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="card-header">
                <div class="logo-icon">🍔</div>
                <h1>Lanchonete Simulator</h1>
                <p>Faça login para acessar o sistema de pedidos</p>
            </div>
            
            <div class="card-body">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <div class="input-group">
                            <span class="input-icon">📧</span>
                            <input type="email" id="email" name="email" class="form-control" 
                                   placeholder="Digite seu e-mail" required autofocus autocomplete="off">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Senha</label>
                        <div class="input-group" style="position: relative;">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="password" name="password" class="form-control" 
                                   placeholder="Digite sua senha" required autocomplete="off">
                            <button type="button" class="toggle-password" data-target="password" 
                                    style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); 
                                           background: none; border: none; cursor: pointer; font-size: 18px; 
                                           color: #777; transition: color 0.2s;">
                                👁️
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-login" id="loginBtn">
                        <span>Entrar no Sistema</span>
                        <span>→</span>
                    </button>
                </form>
                
                <div class="login-help">
                    <a href="/recuperar-senha" id="forgotLink">🔐 Esqueci minha senha</a>
                </div>
                
                <button type="button" class="btn-register" id="registerBtn">
                    📝 Criar nova conta
                </button>
            </div>
        </div>
        <div class="login-footer">
            <span>Sistema de Gerenciamento de Pedidos © 2026</span>
        </div>
    </div>

    <!-- Modal de Registro MELHORADO -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📝 Criar Nova Conta</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="registerForm">
                    <div class="form-group">
                        <label for="regNome">Nome Completo</label>
                        <div class="input-group">
                            <span class="input-icon">👤</span>
                            <input type="text" id="regNome" name="nome" class="form-control" 
                                   placeholder="Digite seu nome completo" required autocomplete="off">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regEmail">E-mail</label>
                        <div class="input-group">
                            <span class="input-icon">📧</span>
                            <input type="email" id="regEmail" name="email" class="form-control" 
                                   placeholder="Digite seu melhor e-mail" required autocomplete="off">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regSenha">Senha</label>
                        <div class="input-group" style="position: relative;">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="regSenha" name="senha" class="form-control" 
                                   placeholder="Senha forte (mínimo 8 caracteres)" required autocomplete="off">
                            <button type="button" class="toggle-password" data-target="regSenha" 
                                    style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); 
                                           background: none; border: none; cursor: pointer; font-size: 18px; 
                                           color: #777; transition: color 0.2s;">
                                👁️
                            </button>
                        </div>
                        <small style="color: #888; display: block; margin-top: 5px; font-size: 11px;">
                            🔒 Requisitos: letra maiúscula, minúscula, número e caractere especial
                        </small>
                    </div>

                    <div class="form-group">
                        <label for="regConfirmSenha">Confirmar Senha</label>
                        <div class="input-group" style="position: relative;">
                            <span class="input-icon">✓</span>
                            <input type="password" id="regConfirmSenha" name="confirm_senha" class="form-control" 
                                   placeholder="Digite a senha novamente" required autocomplete="off">
                            <button type="button" class="toggle-password" data-target="regConfirmSenha" 
                                    style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); 
                                           background: none; border: none; cursor: pointer; font-size: 18px; 
                                           color: #777; transition: color 0.2s;">
                                👁️
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-login" style="margin-top: 20px; width: 100%;">
                        📋 Cadastrar
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>
    
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
    <script>
        // Função global para o olhinho da senha
        document.addEventListener('DOMContentLoaded', function() {
            const toggleButtons = document.querySelectorAll('.toggle-password');
            
            toggleButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const targetId = this.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    
                    if (input) {
                        if (input.type === 'password') {
                            input.type = 'text';
                            this.textContent = '🙈';
                            this.style.color = '#4caf50';
                        } else {
                            input.type = 'password';
                            this.textContent = '👁️';
                            this.style.color = '#777';
                        }
                    }
                });
                
                // Efeito hover no botão
                button.addEventListener('mouseenter', function() {
                    this.style.opacity = '0.8';
                });
                
                button.addEventListener('mouseleave', function() {
                    this.style.opacity = '1';
                });
            });
        });
    </script>
</body>
</html>
