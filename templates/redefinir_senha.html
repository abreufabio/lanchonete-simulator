<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - Lanchonete</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="card-header">
                <div class="logo-icon">🔄</div>
                <h1>Redefinir Senha</h1>
                <p>Crie uma nova senha para sua conta</p>
            </div>
            
            <div class="card-body">
                <form id="redefinirForm">
                    <input type="hidden" id="token" value="{{ token }}">
                    
                    <div class="form-group">
                        <label for="nova_senha">Nova Senha</label>
                        <div class="input-group">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="nova_senha" class="form-control" 
                                   placeholder="Nova senha" required>
                        </div>
                        <small style="color: #888; display: block; margin-top: 5px;">
                            Requisitos: mínimo 8 caracteres, letra maiúscula, minúscula, número e caractere especial
                        </small>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmar_senha">Confirmar Senha</label>
                        <div class="input-group">
                            <span class="input-icon">✓</span>
                            <input type="password" id="confirmar_senha" class="form-control" 
                                   placeholder="Confirme a nova senha" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-login" id="submitBtn">
                        Redefinir Senha
                    </button>
                </form>
                
                <div class="login-help">
                    <a href="/login">← Voltar para o login</a>
                </div>
            </div>
        </div>
    </div>
    
    <div id="notification" class="notification"></div>
    
    <script>
    document.getElementById('redefinirForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const token = document.getElementById('token').value;
        const novaSenha = document.getElementById('nova_senha').value;
        const confirmarSenha = document.getElementById('confirmar_senha').value;
        
        if (!novaSenha || !confirmarSenha) {
            mostrarNotificacao('Preencha todos os campos', 'error');
            return;
        }
        
        if (novaSenha !== confirmarSenha) {
            mostrarNotificacao('As senhas não conferem', 'error');
            return;
        }
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Redefinindo...';
        
        try {
            const response = await fetch('/api/redefinir-senha', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, nova_senha: novaSenha })
            });
            
            const data = await response.json();
            
            if (response.ok && data.success) {
                mostrarNotificacao(data.message, 'success');
                setTimeout(() => { window.location.href = '/login'; }, 3000);
            } else {
                mostrarNotificacao(data.message || 'Erro ao redefinir', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Redefinir Senha';
            }
        } catch (error) {
            mostrarNotificacao('Erro de conexão', 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Redefinir Senha';
        }
    });
    
    function mostrarNotificacao(message, type) {
        const notification = document.getElementById('notification');
        notification.textContent = message;
        notification.className = `notification ${type}`;
        notification.classList.add('show');
        setTimeout(() => notification.classList.remove('show'), 4000);
    }
    </script>
</body>
</html>
