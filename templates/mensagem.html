<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagem - Lanchonete</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="card-header">
                <div class="logo-icon">{% if tipo == 'success' %}✅{% else %}⚠️{% endif %}</div>
                <h1>{{ tipo == 'success' and 'Sucesso!' or 'Atenção!' }}</h1>
            </div>
            
            <div class="card-body">
                <p style="text-align: center; margin-bottom: 30px; color: #ddd;">{{ mensagem }}</p>
                
                <div class="login-help">
                    <a href="{{ link }}">← {{ link_text }}</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
