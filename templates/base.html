<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanchonete - Sistema de Pedidos</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
<div style="display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 15px 20px; margin-bottom: 20px; border-radius: 8px;">
    <div>
        <span style="color: #fff; font-weight: bold;">Lanchonete Simulator</span>
    </div>
    <div style="display: flex; align-items: center; gap: 15px;">
        <span style="color: #4caf50;">👤 {{ usuario if usuario else 'Usuário' }}</span>
        <form action="/logout" method="POST" style="margin: 0;">
            <button type="submit" style="background: #dc3545; color: white; border: none; padding: 6px 15px; border-radius: 5px; cursor: pointer; font-size: 14px;">
                Sair
            </button>
        </form>
    </div>
</div>
    <div class="container">
        <header>
            <h1>Sistema de Pedidos - Lanchonete</h1>
            <nav>
                <a href="/pedidos">Listar Pedidos</a>
                <a href="/pedidos/cadastrar">Cadastrar Pedido</a>
            </nav>
        </header>
        
        <main>
            {% block content %}{% endblock %}
        </main>
        
        <footer>
            <p>Sistema de Pedidos - Todos os direitos reservados</p>
        </footer>
    </div>
    
    <script src="/static/js/main.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
